[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Service Worker 不能被长缓存，否则更新推不下去
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 点位数据用短缓存，重新抓取后能较快生效
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=600"

# 构建产物带内容哈希，可以放心长缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 没有任何客户端路由，访问未知路径时回首页即可
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
